# 82C53234 was pinned here as an 8-byte function, but it is the loop-back
# tail of sub_82C53170 (KeSetEvent; b 82C53234 -> mr r31,r18; b 82C531D8)
# and branches into the middle of its parent. As a standalone function that
# branch cannot be resolved and codegen emits REX_FATAL, so leave it to the
# parent function instead.

# Third pass, 2026-09-01: 3 of the original 8 broken entries were wrongly
# left out earlier because removing them produced no static Validate error
# -- but Validate only checks unresolved DIRECT "b" branches; a function
# reached only via "bl"/"bctr" (indirect/dynamic dispatch) is never checked
# statically, it only fails live when that code path actually runs. Found
# live: 0x8319D238 crashed at runtime the same way as the table thunks.
# Checking the other two confirmed they had ALSO silently vanished from the
# generated code (grep for their DEFINE_REX_FUNC came back empty).
[functions."8319D238"]
size = 0xF8

