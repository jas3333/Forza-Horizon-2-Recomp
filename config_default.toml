# 2026-09-01: audited every entry against Ghidra disassembly + the current
# generated code. 8 entries from the old manual scan were WRONG -- they
# pinned "size = 0x08" on functions that are actually longer, silently
# truncating them (losing the final blr/b and, in several cases, real
# instructions in between). Confirmed broken and removed:
#   83243750, 83243770  (16-byte assert-stub thunks cut to 8 bytes -- this
#                         truncation is what left 0x83243780 undiscovered
#                         and caused the "invalid function" crash there)
#   8323AD68             (atomic lock-increment primitive, widely used --
#                         cut before the lwarx/stwcx retry loop and blr)
#   8319D238, 82C56778   (cut mid-function, well before their real end)
#   82C9F010, 82C9EFD8   (12/16-byte functions cut to 8, losing the blr)
#   82CBFCD0             (20-byte store helper cut to 8, losing the stores+blr)
#
# The remaining 12 entries were verified correct: each is an exact 8-byte
# function/chunk (li+blr, or a 2-instruction tail-call ending in b) where
# size=0x08 matches the real instruction count, so they are kept.

